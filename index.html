const GROUPS = ["Vlaams Belang", "N-VA", "MR (Mouvement Réformateur)", "Les Engagés", "Open VLD", "Lijst Dedecker", "Chez Nous", "Médias (Flandre)", "Médias (France)"];
const KEY = 'facebook-page-list-visited-v1';
const groupsEl = document.getElementById('groups');
const count = document.getElementById('count');
let onlyPending = false;
let visited;
try { const v = JSON.parse(localStorage.getItem(KEY) || '[]'); visited = new Set(Array.isArray(v) ? v : []); }
catch { visited = new Set(); }
function save(){ try{localStorage.setItem(KEY, JSON.stringify([...visited]));}catch{} }
function updateCount(shown){
  const n = entries.filter(e => visited.has(e.url)).length;
  count.textContent = `${n} / ${entries.length} visitées` + (onlyPending ? ` — ${shown} non visitées affichées` : '');
}
function render(){
  groupsEl.replaceChildren();
  let shown = 0;
  for(const g of GROUPS){
    const groupEntries = entries.filter(e => e.group === g);
    const visibleEntries = onlyPending ? groupEntries.filter(e => !visited.has(e.url)) : groupEntries;
    if(!visibleEntries.length) continue;
    const section = document.createElement('section');
    const h2 = document.createElement('h2');
    h2.textContent = `${g} (${groupEntries.length})`;
    section.appendChild(h2);
    const ol = document.createElement('ol');
    for(const e of groupEntries){
      const done = visited.has(e.url);
      if(onlyPending && done) continue;
      shown++;
      const li = document.createElement('li');
      if(done) li.classList.add('visited');
      const a = document.createElement('a');
      a.href = e.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.textContent = e.name; a.title = e.url;
      const urlSpan = document.createElement('span');
      urlSpan.className = 'url'; urlSpan.textContent = e.url;
      const marker = document.createElement('span');
      marker.className = 'mark ' + (done ? 'done' : 'pending');
      marker.textContent = done ? '✓' : '○';
      marker.title = done ? 'Visitée' : 'Pas encore visitée';
      marker.setAttribute('aria-label', marker.title);
      a.addEventListener('click', () => {
        visited.add(e.url); save();
        li.classList.add('visited'); marker.className = 'mark done';
        marker.textContent = '✓'; marker.title = 'Visitée'; marker.setAttribute('aria-label','Visitée');
        updateCount(shown);
      });
      li.append(a, urlSpan, marker); ol.appendChild(li);
    }
    section.appendChild(ol); groupsEl.appendChild(section);
  }
  updateCount(shown);
}
document.getElementById('all').addEventListener('click',()=>{onlyPending=false;render();});
document.getElementById('pending').addEventListener('click',()=>{onlyPending=true;render();});
document.getElementById('reset').addEventListener('click',()=>{
  if(confirm('Effacer tous les marqueurs enregistrés dans ce navigateur ?')){visited.clear();save();render();}
});
render();
