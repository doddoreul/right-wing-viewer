<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liste de pages à bloquer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Liste de pages à bloquer</h1>
  <p class="intro">
    Données chargées depuis <code>pages.json</code>. Chaque lien s’ouvre dans un nouvel onglet.
    Un clic sur le lien ou sur le marqueur vert bascule l’état « visité ».
  </p>

  <div class="tabs" id="tabs"></div>

  <div class="toolbar">
    <span id="count" aria-live="polite">0 / 0 visitées</span>
    <button id="all" type="button">Afficher toutes</button>
    <button id="pending" type="button">Afficher les non visitées</button>
    <button id="reset" type="button">Réinitialiser les marqueurs</button>
  </div>

  <p class="hint">
    Les marqueurs sont enregistrés localement dans ce navigateur.
    Pour modifier la liste, éditez <code>pages.json</code>.
  </p>

  <div id="panels"></div>

  <script src="app.js"></script>
</body>
</html>
